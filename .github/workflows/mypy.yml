---
# yamllint disable rule:line-length
name: MyPy
# yamllint disable-line rule:truthy
on:
    push:
        paths:
            - '**.py'
            - .github/workflows/mypy.yml
            - ci_scripts/setup_python.sh
            - ci_scripts/run_mypy.sh
jobs:
    mypy:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.10"
            - name: Setup Python
              run: |
                set -euo pipefail
                ${GITHUB_WORKSPACE}/ci_scripts/setup_python.sh ${GITHUB_WORKSPACE}
            - name: MyPy
              run: |
                set -euo pipefail
                ${GITHUB_WORKSPACE}/ci_scripts/run_mypy.sh ${GITHUB_WORKSPACE}
